name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build linux-x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system deps
        run: sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/mewc-solo-pool

      - name: Rename artifact
        run: |
          cp target/release/mewc-solo-pool mewc-solo-pool-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mewc-solo-pool-linux-x86_64
          path: mewc-solo-pool-linux-x86_64

      # Rolling pre-release — updated on every push to main
      - name: Update rolling pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: "Rolling build (latest main)"
          prerelease: true
          body: |
            Automatic build from the latest `main` commit.
            Not a stable release — use a tagged version for production.

            **Commit:** ${{ github.sha }}
          files: mewc-solo-pool-linux-x86_64
          make_latest: false

      # Proper versioned release on v* tags
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: mewc-solo-pool-linux-x86_64
          make_latest: true
